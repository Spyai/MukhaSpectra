<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta
      name="description"
      content="MukhaSpectra analysis console — oral screening and triage aid. Research prototype, not for clinical use."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MukhaSpectra · Analysis console</title>
    <script>
      // Apply the stored or system theme before first paint (no flash).
      (function () {
        try {
          var s = localStorage.getItem('mukha-theme');
          var t =
            s === 'light' || s === 'dark'
              ? s
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>MukhaSpectra needs JavaScript. Research prototype — not for clinical use.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
