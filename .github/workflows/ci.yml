name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Pipeline + backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            backend/pyproject.toml
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b fonts-dejavu-core fonts-inter poppler-utils
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "pipeline[raw,onnx,dev]" -e "backend[dev]"
      - name: Lint
        run: |
          ruff check pipeline backend
          ruff format --check pipeline backend
      - name: Schema drift
        run: python -m mukha_pipeline.schema.export --check
      - name: Tests (pipeline coverage gate 80%)
        run: |
          pytest pipeline/tests -q --cov=mukha_pipeline --cov-report=term-missing --cov-fail-under=80
          pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Mock-mode browser smoke test
        run: npx playwright install --with-deps chromium && npm run e2e:mock

  e2e:
    name: End-to-end (upload → analysis → PDF)
    runs-on: ubuntu-24.04
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pipeline/pyproject.toml
            backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b fonts-dejavu-core fonts-inter
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "pipeline[raw,onnx]" -e backend
          cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright (real backend + pipeline + sample data)
        run: cd frontend && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: Docker images (quickstart)
    runs-on: ubuntu-24.04
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and console images
        run: docker compose build
        env:
          MUKHA_BUILD_ID: ${{ github.sha }}
      - name: Start the stack and smoke-test it
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173/ | grep -q "<div id=\"root\""
          curl -fsS -X POST http://127.0.0.1:5173/api/v1/demo/screenings/low | grep -q '"overall_risk_level":"LOW"'
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
