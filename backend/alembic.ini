# Alembic configuration for the MukhaSpectra API.
#
#   cd backend && ../.venv/bin/alembic upgrade head
#   cd backend && ../.venv/bin/alembic revision --autogenerate -m "add x"
#
# The database URL comes from the app settings (MUKHA_DATABASE_URL, default
# sqlite file backend/var/mukha.db). The app also upgrades to head on startup.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
# sqlalchemy.url is intentionally empty: env.py reads it from app.settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
