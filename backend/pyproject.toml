[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mukha-backend"
version = "0.1.0"
description = "MukhaSpectra API: ingestion, analysis orchestration, storage and report engine (research prototype, not for clinical use)."
requires-python = ">=3.11"
license = { text = "Proprietary - SparkyAI Private Limited" }
dependencies = [
  "mukha-pipeline",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "weasyprint>=61",
  "matplotlib>=3.8",
  "qrcode>=7.4",
  "pyyaml>=6.0",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "pypdf>=4.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["reports/templates/*", "reports/static/*", "config/*.yaml"]
