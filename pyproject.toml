# Workspace-level tool configuration. Packages live in pipeline/ and backend/.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "firmware", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N803", "N806", "B008"]  # image maths uses W, D, S, R, G, B names; FastAPI Depends()

[tool.ruff.lint.isort]
known-first-party = ["mukha_pipeline", "app"]

# Formatting uses `ruff format` (Black-compatible); Black 26 crashes on one test fixture.
[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "backend/tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["pipeline/tests", "backend/tests"]
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]

[tool.coverage.run]
source = ["mukha_pipeline"]
omit = ["*/tests/*"]
