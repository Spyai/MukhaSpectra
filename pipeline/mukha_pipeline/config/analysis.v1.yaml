# MukhaSpectra analysis parameters, v1
# Baseline values chosen from the autofluorescence literature and tuned on synthetic data.
# Not clinically validated. Changing any value changes the sha256 recorded in every result.
name: mukhaspectra-analysis
version: 1.1.0
status: baseline_unvalidated

working_max_side_px: 1024

registration:
  method_order: [ecc_affine, orb_homography]
  ecc_max_iterations: 200
  ecc_epsilon: 1.0e-5
  ecc_pyramid_levels: 3
  ecc_gaussian_sigma: 2.0
  orb_features: 3000
  orb_ratio_test: 0.75
  ransac_reproj_threshold: 4.0       # px at the ORB estimation size
  max_translation_fraction: 0.15     # reject warps that move the image more than this
  max_scale_change: 0.15
  # Added by the registration module (defaults in preprocess/registration.py match these).
  estimation_max_side_px: 512        # ECC runs on gradient images at this size, warp is lifted
  orb_max_side_px: 1024              # ORB keypoints are pixel-quantised: estimate larger
  ecc_gauss_filt_size: 5             # OpenCV ECC internal smoothing (odd)
  orb_min_matches: 12
  orb_full_confidence_inliers: 50    # ORB confidence = inlier ratio * min(1, inliers / this)
  max_rotation_deg: 10.0             # WL and AF are taken < 1 s apart through the same clip
  accept_confidence_min: 0.30        # method accepted above this; QC applies its own limits
  cross_check: true                  # run every method; veto the winner if a confident one
  cross_check_max_disagreement_fraction: 0.02   # disagrees by > this x image diagonal
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  valid_erode_px: 2                  # drop border pixels blended with the warp's zero fill
  # Labels burned into both photos at the same position (watermark, timestamp) do not move
  # with the tissue and would pull alignment to identity. Tissue never has the same RGB under
  # white light and 405 nm, so identical non-dark pixels are excluded (plus a margin).
  auto_exclude_identical: true
  identical_tolerance: 0.05          # max |WL - AF| per RGB channel (0-1) to count as identical
  identical_min_luminance: 0.10      # ignore dark pixels (black in both is not a label)
  identical_min_area_fraction: 0.0001  # drop isolated coincidences smaller than this
  identical_margin_fraction: 0.04    # dilation (x shorter image side) to cover the label band

segmentation:
  method: classical_hsv_lab
  version: 1.1.0
  mucosa_hue_ranges: [[0, 22], [160, 180]]   # OpenCV hue 0-180: pinks and reds
  mucosa_saturation_min: 0.18
  mucosa_value_min: 0.18
  teeth_saturation_max: 0.22
  teeth_value_min: 0.62
  teeth_lab_a_max: 8                 # pinkish whites (Lab a* >= this) are pale mucosa, not teeth
  background_value_max: 0.12
  specular_value_min: 0.96
  specular_saturation_max: 0.20
  specular_max_blob_fraction: 0.002  # specular = near-white blobs up to this image share only;
                                     #   larger bright areas (over-exposed white patch) are tissue
  specular_group_px: 2               # near-white pixels this close are one blob (speckled plaque)
  fill_holes_max_fraction: 0.35      # white patches enclosed by mucosa are kept as mucosa (a
                                     #   leukoplakia can fill a large part of a close-up)
  fill_holes_cavity_max_fraction: 0.10  # ...but a hole containing dark cavity shadow (mouth
  fill_holes_cavity_min_share: 0.05  #   opening in a frontal view: >= this share dark) keeps 0.10
  min_component_fraction: 0.01
  morphology_kernel_px: 7
  mucosa_lab_a_min: 14               # Lab a* (redness) also marks mucosa outside the hue ranges
  partial_enclosure_min: 0.85        # whitish blob with >= this share of its rim on mucosa (and
                                     #   not touching the image border) is kept as mucosa too
  specular_dilate_px: 1              # highlight halo is unreliable as well
  confidence_full_mucosa_fraction: 0.25  # confidence heuristic saturates at this mucosa share
  confidence_ambiguous_max: 0.6      # confidence 0 when this share of pixels matches no rule
  failed_mucosa_fraction: 0.02       # summary status "failed" below this mucosa share
  low_confidence_below: 0.5          # summary status "low_confidence" below this confidence
  # AF cross-check after registration (refine_masks_with_af): teeth fluoresce brightly at
  # 405 nm, so whitish "teeth" whose smoothed linear AF green is below this x the median mucosa
  # green are tissue (a white patch) and move back into the mucosa.
  teeth_af_min_ratio: 1.0
  teeth_af_smoothing_sigma_px: 3.0
  teeth_af_open_px: 7                # drop thin misregistration slivers along tooth edges
  teeth_af_min_blob_fraction: 0.002  # of the image; smaller dim blobs stay excluded
  teeth_af_min_mucosa_pixels: 200    # need this much mucosa with valid AF for the comparison

af:
  smoothing_sigma_px: 3.0
  fvl_relative_threshold: 0.75       # relative AF below this = fluorescence visualisation loss
  min_region_area_fraction: 0.002    # of the mucosa area
  min_region_area_px: 150
  morphology_open_px: 5
  morphology_close_px: 9
  surround_ring_px: 15
  edge_margin_px: 3                  # ignore a thin mucosa rim: AF/WL misregistration there
                                     #   would read as a band of fluorescence loss
  reference_percentile_low: 50       # in-image reference uses mucosa between these percentiles
  reference_percentile_high: 95      #   of green: FVL covering up to ~45% of the mucosa (a
                                     #   centred close-up) and glare do not drag it
  reference_outlier_ratio: 1.5       # AF highlights > this x the 90th pct of mucosa green are
                                     #   set aside before the in-image reference (0 = off)
  relative_af_grid_size: 96          # downsampled grid for the 3D / interactive view
  heatmap_alpha_max: 0.75
  reference_min_pixels: 200          # fewer usable mucosa pixels -> no in-image reference
  insufficient_mucosa_fraction: 0.02 # AF status "insufficient_mucosa" below this image share
  heatmap_unanalysed_desaturate: 0.35  # grey out what was not analysed (teeth, shadow, glare)

confounders:
  porphyrin_red_over_green_min: 0.85  # AF red / green; red porphyrin fluorescence from plaque
  porphyrin_red_rel_min: 1.4          # AND red >= this x the image's median mucosa red (a red
                                      #   EXCESS: in deep FVL red/green rises with no red emission)
  porphyrin_red_ref_min_of_green: 0.10  # red reference floored at this x median mucosa green, so
                                      #   a near-zero (noise-only) red channel is not "excess"
  porphyrin_smoothing_sigma_px: 2.0   # light smoothing of red/green before the porphyrin test
  pigmentation_lab_l_max: 45          # WL L* (0-100): dark brown/black
  pigmentation_lab_a_max: 20          # WL a*: melanin brown is ~8-17; reddish pixels are never pigment
  pigmentation_hue_range: [5, 30]     # OpenCV hue: browns
  blood_lab_a_min: 25                 # WL a*: dark reddish = blood or a red patch (never discounted;
                                      #   the triage red-area floor keeps it at least MODERATE)
  blood_lab_l_max: 45
  flag_overlap_min: 0.15              # report a confounder when it covers >= this of a region
  pigmentation_saturation_min: 0.15   # WL HSV S: grey shadow is not brown pigment
  af_saturation_min: 0.98             # AF channel at/above this counts as saturated glare
  glare_dilate_px: 2                  # glare is cut out of mucosa; look just around the region

wl_classifier:
  input_size: 224
  labels: [normal, white_patch, red_patch, ulcer_mass, other]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  saliency_patch_fraction: 0.125
  saliency_stride_fraction: 0.0625
  saliency_max_side_px: 448          # occlusion runs at this size, then the map is upsampled
  crop_margin_fraction: 0.10         # margin around the mucosa bounding box before resizing

spectral:
  channels_used_for_features: [F1_415, F2_445, F3_480, F4_515, F5_555, F6_590, F7_630, F8_680]
  classifier:
    method: rules_v2
    # Placeholder heuristic thresholds on the lesion-vs-reference delta. Not trained, not
    # validated. rules_v2: the delta is computed on the per-channel quotient lesion / reference
    # (spectral/features.py reference_delta), which cancels the probe's LED spectrum, filters and
    # gain, so calibrated and uncalibrated readings use the same thresholds:
    #   hb_proxy delta = 540-590 nm haemoglobin dip of the quotient (0 = same shape)
    #   ratio_555_630 delta = ratio_lesion / ratio_reference - 1 (-0.10 = 10 % lower)
    # Tuned on SYNTHETIC readings (mukha_pipeline.synthetic, reference hb 0.25, repeat noise 1 %):
    # equal blood volume stays below the first cut-off (~4 SD of the repeat noise), hb 0.36 gives
    # ~+0.04 / -6.6 % (indeterminate), hb 0.6 gives ~+0.125 / -19.5 % (suspicious).
    # Keep equal to the triage tiers in triage_rules.v1.yaml lesion.spectral.
    hb_proxy_delta_suspicious: 0.06
    hb_proxy_delta_indeterminate: 0.025
    ratio_555_630_delta_suspicious: -0.10
    ratio_555_630_delta_indeterminate: -0.04
