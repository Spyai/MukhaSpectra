[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mukha-pipeline"
version = "0.1.0"
description = "MukhaSpectra analysis library: QC, calibration, WL/AF registration, autofluorescence analysis, spectral features and rule-based triage for oral cancer screening (research prototype, not for clinical use)."
requires-python = ">=3.11"
license = { text = "Proprietary - SparkyAI Private Limited" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pillow>=10.2",
  "pillow-heif>=0.16",
]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]          # DNG support
onnx = ["onnxruntime>=1.17"]   # WL lesion classifier inference
dev = ["pytest>=8", "pytest-cov>=5", "onnx>=1.15", "jsonschema>=4.21", "ruff>=0.14"]

[tool.setuptools.packages.find]
include = ["mukha_pipeline*"]

[tool.setuptools.package-data]
mukha_pipeline = ["config/*.yaml", "schema/*.json"]
